# CaseRadar Next.js Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: caseradar
  namespace: web
  labels:
    app: caseradar
spec:
  replicas: 2
  selector:
    matchLabels:
      app: caseradar
  template:
    metadata:
      labels:
        app: caseradar
    spec:
      containers:
      - name: caseradar
        image: caseradar/web:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          name: http
        envFrom:
        - configMapRef:
            name: caseradar-config
        - secretRef:
            name: caseradar-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
