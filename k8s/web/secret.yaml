# Next.js App Secrets
# For production: use external secret management (Vault, AWS Secrets Manager, etc.)
# For local dev: update these with your actual API keys
apiVersion: v1
kind: Secret
metadata:
  name: caseradar-secrets
  namespace: web
  labels:
    app: caseradar
type: Opaque
stringData:
  # Database (internal K8s DNS)
  DATABASE_URL: "postgresql://postgres:postgres@postgres.database.svc.cluster.local:5432/caseradar"
  DIRECT_URL: "postgresql://postgres:postgres@postgres.database.svc.cluster.local:5432/caseradar"

  # Redis (internal K8s DNS)
  REDIS_URL: "redis://redis.cache.svc.cluster.local:6379"

  # Embedding service (internal K8s DNS)
  EMBEDDING_SERVICE_URL: "http://embedding-service.embedding.svc.cluster.local:80"

  # Auth (Clerk) - UPDATE THESE with your real keys
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_REPLACE_ME"
  CLERK_SECRET_KEY: "sk_test_REPLACE_ME"

  # Billing (Stripe) - UPDATE THESE with your real keys
  STRIPE_SECRET_KEY: "sk_test_REPLACE_ME"
  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: "pk_test_REPLACE_ME"

  # AI Services - UPDATE THESE with your real keys
  OPENAI_API_KEY: "sk-REPLACE_ME"
  ANTHROPIC_API_KEY: "sk-ant-REPLACE_ME"
