# CaseRadar Next.js Horizontal Pod Autoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: caseradar-hpa
  namespace: web
  labels:
    app: caseradar
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: caseradar
  # Local development: 1-4 pods
  # Production: change to 2-20 pods
  minReplicas: 1
  maxReplicas: 4
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
      - type: Pods
        value: 2
        periodSeconds: 30
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Pods
        value: 1
        periodSeconds: 120
      selectPolicy: Min
