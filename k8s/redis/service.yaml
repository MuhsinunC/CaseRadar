# Redis Service
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: cache
  labels:
    app: redis
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
    protocol: TCP
    name: redis
  type: ClusterIP
---
# NodePort for local development access
# In production: remove this
apiVersion: v1
kind: Service
metadata:
  name: redis-external
  namespace: cache
  labels:
    app: redis
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
    nodePort: 30379
    protocol: TCP
    name: redis
  type: NodePort
