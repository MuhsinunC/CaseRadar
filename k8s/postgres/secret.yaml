# PostgreSQL Credentials
# For production: use external secret management (Vault, AWS Secrets Manager, etc.)
# For local dev: these defaults work out of the box
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: database
  labels:
    app: postgres
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: caseradar
  # Connection string for the app (internal K8s DNS)
  DATABASE_URL: "postgresql://postgres:postgres@postgres.database.svc.cluster.local:5432/caseradar"
  # Direct URL (same for local, different for production with pgbouncer)
  DIRECT_URL: "postgresql://postgres:postgres@postgres.database.svc.cluster.local:5432/caseradar"
