apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: embedding-service-hpa
  namespace: embedding
  labels:
    app: embedding-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: embedding-service
  # Scaling strategy: maximize CPU utilization up to 90%
  # HPA will keep adding pods until average pod CPU < 90%
  # RAM limit: ~8 pods max (8 × 900MB ≈ 7.2GB)
  minReplicas: 1
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        # Scale up when pods exceed 90% CPU (aggressive)
        # This naturally saturates node CPU
        averageUtilization: 90
  behavior:
    scaleUp:
      # Scale up IMMEDIATELY when overloaded
      stabilizationWindowSeconds: 0
      policies:
      - type: Pods
        value: 4  # Add up to 4 pods at once
        periodSeconds: 15
      - type: Percent
        value: 100  # Or double the current count
        periodSeconds: 15
      selectPolicy: Max
    scaleDown:
      # Scale down slowly (5 min stabilization)
      stabilizationWindowSeconds: 300
      policies:
      - type: Pods
        value: 1
        periodSeconds: 120
      selectPolicy: Min
