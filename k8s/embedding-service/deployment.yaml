apiVersion: apps/v1
kind: Deployment
metadata:
  name: embedding-service
  namespace: embedding
  labels:
    app: embedding-service
    component: ml
spec:
  replicas: 1  # Baseline - HPA scales from here
  selector:
    matchLabels:
      app: embedding-service
  template:
    metadata:
      labels:
        app: embedding-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: embedding-worker
        image: caseradar/embedding-service:latest
        imagePullPolicy: IfNotPresent  # Use local image if available
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            memory: "1Gi"    # Model takes ~900Mi, leave headroom
            cpu: "200m"      # Low request allows more pods to schedule
          limits:
            memory: "2Gi"    # Allow for load-induced memory growth
            cpu: "2000m"     # Can burst to 2 cores under load
        env:
        - name: MODEL_NAME
          value: "nomic-ai/nomic-embed-text-v1.5"
        - name: MAX_BATCH_SIZE
          value: "500"
        - name: EMBEDDING_WORKERS
          value: "1"  # 1 worker per pod, scale with HPA
        # HuggingFace cache directory - shared across all pods
        - name: HF_HOME
          value: "/model-cache"
        - name: TRANSFORMERS_CACHE
          value: "/model-cache"
        - name: SENTENCE_TRANSFORMERS_HOME
          value: "/model-cache"
        volumeMounts:
        - name: model-cache
          mountPath: /model-cache
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 120  # Model download takes time
          periodSeconds: 30         # Check less frequently under load
          timeoutSeconds: 30        # Allow more time when CPU-bound
          failureThreshold: 5       # More tolerance before restart
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 15        # Allow more time when CPU-bound
          failureThreshold: 5
        startupProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 60  # Allow up to 10 minutes for first model download
      volumes:
      - name: model-cache
        persistentVolumeClaim:
          claimName: model-cache
      terminationGracePeriodSeconds: 30
