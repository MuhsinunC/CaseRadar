apiVersion: v1
kind: Service
metadata:
  name: embedding-service
  labels:
    app: embedding-service
spec:
  selector:
    app: embedding-service
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: embedding-service-metrics
  labels:
    app: embedding-service
    monitoring: "true"
spec:
  selector:
    app: embedding-service
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: metrics
  type: ClusterIP
