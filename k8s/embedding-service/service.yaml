apiVersion: v1
kind: Service
metadata:
  name: embedding-service
  namespace: embedding
  labels:
    app: embedding-service
spec:
  selector:
    app: embedding-service
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  type: ClusterIP
---
# NodePort service for local access from host machine
apiVersion: v1
kind: Service
metadata:
  name: embedding-service-external
  namespace: embedding
  labels:
    app: embedding-service
spec:
  selector:
    app: embedding-service
  ports:
  - port: 80
    targetPort: 8080
    nodePort: 30080
    protocol: TCP
    name: http
  type: NodePort
