services:
  # Nginx reverse proxy for load balancing embedding service
  nginx:
    image: nginx:alpine
    container_name: caseradar-nginx
    restart: unless-stopped
    ports:
      - "8090:80"  # Embedding load balancer
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - embedding
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Scalable Embedding Service - run multiple instances with --scale
  # Usage: docker compose up -d --scale embedding=4
  embedding:
    build:
      context: ./services/embedding-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - MODEL_NAME=nomic-ai/nomic-embed-text-v1.5
      - REDIS_URL=redis://redis:6379
      - MAX_BATCH_SIZE=1000
      - EMBEDDING_WORKERS=1  # 1 worker per container, scale horizontally
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      start_period: 120s  # Model takes time to load
      retries: 3
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

  # PostgreSQL with pgvector extension for vector similarity search
  postgres:
    image: pgvector/pgvector:pg16
    container_name: caseradar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: caseradar
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d caseradar']
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching (optional, for development)
  redis:
    image: redis:7-alpine
    container_name: caseradar-redis
    restart: unless-stopped
    ports:
      - '6380:6379'  # Use 6380 externally to avoid conflict with other Redis instances
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # pgAdmin for database management (optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: caseradar-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@caseradar.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - '5050:80'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:

networks:
  default:
    name: caseradar-network
