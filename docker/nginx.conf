events {
    worker_connections 1024;
}

http {
    # Use Docker's internal DNS resolver
    # Docker DNS (127.0.0.11) returns IPs in round-robin for scaled services
    resolver 127.0.0.11 valid=1s ipv6=off;
    resolver_timeout 5s;

    server {
        listen 80;

        # Increase buffer sizes for large embedding requests
        client_max_body_size 10M;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        location / {
            # Use variable to force DNS re-resolution on each request
            # Docker DNS round-robins multiple container IPs
            set $upstream_host embedding;
            proxy_pass http://$upstream_host:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 60s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # Health check endpoint
        location /nginx-health {
            return 200 'healthy';
            add_header Content-Type text/plain;
        }
    }
}
